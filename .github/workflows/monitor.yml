name: Dagelijkse controle

on:
  schedule:
    # 03:17 UTC = 05:17 in summer, 04:17 in winter (Dutch time). Off the full hour, because
    # GitHub delays runs most at busy moments; even so they can start hours late.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: pytest -q

      - name: Check races
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m loopjespost.monitor

      - name: Save results
        run: |
          git config user.name "loopjespost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update race status $(date -u +%F)"
          # main may have moved on while this run was busy (e.g. a race added via the website).
          git pull --rebase origin main
          git push origin HEAD:main
